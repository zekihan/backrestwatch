{{- $config := deepCopy .Values.config -}}
{{- $_ := set $config "stateFile" "/data/evidence.json" -}}
{{- $_ := set $config "listenAddress" ":8080" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backrestwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backrestwatch.labels" . | nindent 4 }}
data:
  config.json: |
    {{- $config | toPrettyJson | nindent 4 }}
