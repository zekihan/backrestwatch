{{- $authSecret := required "accessControl.existingSecret must name an existing monitoring credential Secret" .Values.accessControl.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backrestwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backrestwatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "backrestwatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "backrestwatch.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "backrestwatch.serviceAccount" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backrestwatch
          image: {{ include "backrestwatch.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config=/config/config.json"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: evidence
              mountPath: /data
            - name: backup-auth
              mountPath: /var/run/backrestwatch-auth
              readOnly: true
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "backrestwatch.fullname" . }}
        - name: evidence
          persistentVolumeClaim:
            claimName: {{ include "backrestwatch.claim" . }}
        - name: backup-auth
          secret:
            secretName: {{ $authSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.accessControl.secretKey | quote }}
                path: token
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
