{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingressPorts }}
{{- fail "networkPolicy.ingressPorts must contain at least one TCP port" }}
{{- end }}
{{- if or (eq (len .Values.networkPolicy.apiPeers) 0) (eq (len .Values.networkPolicy.ingressFrom) 0) }}
{{- fail "networkPolicy.apiPeers and ingressFrom must identify API peers and monitoring clients" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backrestwatch.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "backrestwatch.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- required "networkPolicy.ingressFrom must identify monitoring clients" .Values.networkPolicy.ingressFrom | toYaml | nindent 8 }}
      ports:
        {{- range .Values.networkPolicy.ingressPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
  egress:
    - to:
        {{- range (required "networkPolicy.apiPeers must identify Kubernetes API peers" .Values.networkPolicy.apiPeers) }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.apiPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
