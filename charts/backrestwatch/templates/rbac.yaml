{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "backrestwatch.clusterRoleName" . }}
  labels:
    {{- include "backrestwatch.labels" . | nindent 4 }}
rules:
  - apiGroups: [postgres-operator.crunchydata.com]
    resources: [postgresclusters]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "backrestwatch.clusterRoleName" . }}
  labels:
    {{- include "backrestwatch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "backrestwatch.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backrestwatch.serviceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
